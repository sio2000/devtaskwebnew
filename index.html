      #boot-splash{position:fixed;inset:0;z-index:101;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#08080B}
      #boot-splash img{width:96px;height:96px;border-radius:1rem;background:#fff;padding:12px;object-fit:contain;margin-bottom:24px;box-shadow:0 25px 50px -12px rgba(0,0,0,.6)}

      #boot-splash i{display:block;height:24px;margin-bottom:28px}
      #boot-splash span{display:block;width:176px;height:4px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden}
      #boot-splash span::after{content:"";display:block;height:100%;width:100%;border-radius:999px;background:linear-gradient(90deg,#6E56F8,#34E4EA);animation:boot-bar 1.6s ease-in-out infinite}
      @keyframes boot-bar{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
    </style>
    <noscript><style>#boot-splash{display:none}</style></noscript>
